name: Gemini test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Modelleri yoxla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.request, urllib.error

          key = os.environ.get("GEMINI_API_KEY", "")
          base = "https://generativelanguage.googleapis.com/v1beta"
          out = []

          def call(model):
              body = {"contents": [{"parts": [{"text": "Bir cümlə ilə cavab ver: Bakı hansı ölkənin paytaxtıdır?"}]}]}
              req = urllib.request.Request(
                  base + "/models/" + model + ":generateContent",
                  data=json.dumps(body).encode(),
                  headers={"x-goog-api-key": key, "Content-Type": "application/json"},
              )
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = json.loads(r.read())
                  text = data["candidates"][0]["content"]["parts"][0]["text"].strip()
                  return model + ": OK, " + str(round(time.time() - t, 1)) + " san. - " + text[:150]
              except urllib.error.HTTPError as e:
                  return model + ": HTTP " + str(e.code) + " - " + e.read().decode()[:200]
              except Exception as e:
                  return model + ": XƏTA - " + str(e)[:150]

          for model in ["gemini-flash-lite-latest", "gemini-2.5-flash-lite", "gemini-2.5-flash"]:
              out.append(call(model))

          open("result.txt", "w", encoding="utf-8").write("\n\n".join(out)[:3500])
          EOF

      - name: Neticeni Telegrama gonder
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode "text@result.txt"
