name: Xeber topla

# Yalnız əl ilə işə salınır (Actions -> Run workflow). Hər dəfə YALNIZ 1 xəbər tapıb Telegram-a "xəbər kartı"
# kimi göndərir. Şəkil/video göndərib "Hazırla" basandan sonra qalanını "Duymeleri yoxla" iş axını edir.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reportbaku-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kitabxanaları qur
        run: pip install feedparser beautifulsoup4 pillow requests

      - name: Xəbərləri topla
        env:
          TARGET_COUNT: "5"
        run: python collect_news.py

      - name: AI ilə mətnləri hazırla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-lite-latest
        run: python process_news.py

      - name: Xəbər kartını Telegram-a göndər
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANNOUNCE_COUNT: "3"
        run: python announce_news.py

      - name: Nəticəni repoda saxla
        if: always()
        run: |
          git config user.name "reportbaku-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in seen.json selected_news.json sources_status.json post_drafts.json pending.json; do
            if [ -e "$f" ]; then git add -A "$f"; fi
          done
          git diff --staged --quiet || git commit -m "yeni xeber"
          git pull --rebase --autostash
          git push
