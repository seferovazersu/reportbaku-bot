name: Xeber topla

# Hələlik yalnız əl ilə işə salınır (Actions -> Run workflow düyməsi).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kitabxananı qur
        run: pip install feedparser

      - name: Xəbərləri topla
        run: python collect_news.py

      - name: Nəticəni repoda saxla
        run: |
          git config user.name "reportbaku-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json selected_news.json
          git diff --staged --quiet || git commit -m "yeni xeberler"
          git push
