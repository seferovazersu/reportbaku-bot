name: Xeber topla

# Hələlik yalnız əl ilə işə salınır (Actions -> Run workflow düyməsi).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kitabxanaları qur
        run: pip install feedparser beautifulsoup4

      - name: Xəbərləri topla
        run: python collect_news.py

      - name: AI ilə post mətnlərini hazırla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: gemini-flash-lite-latest
        run: python process_news.py

      - name: Nəticəni repoda saxla
        run: |
          git config user.name "reportbaku-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json selected_news.json sources_status.json post_drafts.json
          git diff --staged --quiet || git commit -m "yeni xeberler"
          git push
