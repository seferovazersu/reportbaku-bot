name: Xeber topla

# Hələlik yalnız əl ilə işə salınır (Actions -> Run workflow düyməsi).
# Avtomatik cədvəli sınaq uğurlu olandan sonra əlavə edəcəyik.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reportbaku-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Şrift, ffmpeg və kitabxanaları qur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter ffmpeg
          pip install feedparser beautifulsoup4 pillow requests

      - name: Xəbərləri topla
        env:
          TARGET_COUNT: "4"
        run: python collect_news.py

      - name: AI ilə post mətnlərini hazırla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-lite-latest
        run: python process_news.py

      - name: Foto postu hazırla, Reels-i növbəyə qoy
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REELS_PER_RUN: "2"
          POSTS_PER_RUN: "1"
        run: python build_posts.py

      - name: Reels videolarını hazırla və Telegram-a göndər
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python build_videos.py

      - name: Videoları media budağına göndər
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls videos_out/*.mp4 >/dev/null 2>&1; then
            REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            rm -rf /tmp/media
            if git clone -q --depth 1 --branch media "$REMOTE" /tmp/media 2>/dev/null; then
              rm -rf /tmp/media/.git
            else
              mkdir -p /tmp/media
            fi
            python3 media_sync.py /tmp/media videos_out
            cd /tmp/media
            git init -q -b media
            git config user.name "reportbaku-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -q -m "media"
            git remote add origin "$REMOTE"
            git push -f -q origin media
          else
            echo "Yeni video yoxdur."
          fi

      - name: Nəticəni repoda saxla
        if: always()
        run: |
          git config user.name "reportbaku-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in seen.json selected_news.json sources_status.json post_drafts.json pending.json posts; do
            if [ -e "$f" ]; then git add -A "$f"; fi
          done
          git diff --staged --quiet || git commit -m "yeni xeberler"
          git pull --rebase --autostash
          git push
